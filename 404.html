<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>NextCut Studio</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // Handles both /Nex-cut-studio-/watch/... and root domain /watch/...
      var l = window.location;
      var repoBase = '/Nex-cut-studio-';
      var path = l.pathname;
      var cleanPath = path;

      if (cleanPath.startsWith(repoBase)) {
        cleanPath = cleanPath.slice(repoBase.length);
      }
      if (!cleanPath.startsWith('/')) {
        cleanPath = '/' + cleanPath;
      }

      // Convert path & search into GitHub Pages SPA query redirect
      var newUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        repoBase + '/?' + cleanPath +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash;

      l.replace(newUrl);
    </script>
  </head>
  <body>
  </body>
</html>
